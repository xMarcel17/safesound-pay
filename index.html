<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeSound - Płatność</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex; justify-content: center; align-items: center;
      height: 100vh; background-color: #f3f4f6; margin: 0;
    }
    .card {
      background: white; padding: 32px; border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center;
      max-width: 350px; width: 90%;
    }
    .logo { 
      max-width: 200px; 
      height: auto; 
      margin-bottom: 24px; 
      display: inline-block;
    }
    h2 { margin: 0 0 8px 0; color: #1f2937; }
    p { color: #6b7280; margin-bottom: 24px; }
    .price { font-size: 24px; font-weight: bold; color: #111827; margin-bottom: 24px; }
    .btn {
      background: #6366f1; color: white; border: none; padding: 16px;
      width: 100%; border-radius: 12px; font-size: 16px; font-weight: bold;
      cursor: pointer; transition: background 0.3s;
    }
    .btn:hover { background: #4f46e5; }
    .btn:disabled { background: #9ca3af; cursor: not-allowed; }
    .msg { margin-top: 16px; font-weight: bold; display: none; }
    .success { color: #10b981; }
    .error { color: #ef4444; }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">🌟</div>
    <h2>SafeSound Premium</h2>
    <p>Odblokuj pełny potencjał aplikacji</p>
    <div class="price">49.99 PLN</div>
    
    <button id="payBtn" class="btn" onclick="processPayment()">Zapłać teraz</button>
    
    <div id="successMsg" class="msg success">Płatność udana! Możesz zamknąć przeglądarkę i wrócić do aplikacji.</div>
    <div id="errorMsg" class="msg error">Wystąpił błąd płatności.</div>
  </div>

  <script>
    async function processPayment() {
      const btn = document.getElementById('payBtn');
      const successMsg = document.getElementById('successMsg');
      const errorMsg = document.getElementById('errorMsg');

      btn.disabled = true;
      btn.innerText = "Przetwarzanie...";
      errorMsg.style.display = "none";

      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');

      if (!token) {
        errorMsg.innerText = "Brak tokena użytkownika. Otwórz stronę z poziomu aplikacji.";
        errorMsg.style.display = "block";
        btn.innerText = "Zapłać teraz";
        btn.disabled = false;
        return;
      }

      try {
        const apiUrl = 'http://192.168.1.2:8000/api/users/pay_for_subscription'; 

        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({
            platform: 'web_hosted',
            payment_data: { method: "mock_card" }
          })
        });

        if (response.ok) {
          successMsg.style.display = "block";
          btn.style.display = "none"; 
        } else {
          errorMsg.innerText = "Serwer odrzucił płatność.";
          errorMsg.style.display = "block";
          btn.innerText = "Spróbuj ponownie";
          btn.disabled = false;
        }
      } catch (error) {
        console.error(error);
        errorMsg.innerText = "Błąd połączenia z serwerem.";
        errorMsg.style.display = "block";
        btn.innerText = "Spróbuj ponownie";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
